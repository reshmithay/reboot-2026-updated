server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Proxy API calls to the Cloud Run backend service
    location /api/ {
        proxy_pass https://reboot-backend-4kglgwxwra-uc.a.run.app;
        proxy_http_version 1.1;

        # Cloud Run requires the Host header to match its own URL
        proxy_set_header Host reboot-backend-4kglgwxwra-uc.a.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for SSL/TLS SNI handshake with Google Cloud Run
        proxy_ssl_server_name on;
        proxy_read_timeout 60s;
    }

    # Serve static assets with caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — all other routes served by index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}