  # loki:
  #   image: grafana/loki:latest
  #   volumes:
  #     - ./monitoring/loki:/etc/loki
  #   ports:
  #     - "3100:3100"
  #   networks:
  #     - anomaly-net

  nginx:
    image: nginx:alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - anomaly-net

volumes:
  postgres_data:

networks:
  anomaly-net:
    driver: bridge
